# This rule is not used by the project ansible-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over anisble-operator.lightjack.de.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ansible-operator
    app.kubernetes.io/managed-by: kustomize
  name: ansiblehost-admin-role
rules:
- apiGroups:
  - anisble-operator.lightjack.de
  resources:
  - ansiblehosts
  verbs:
  - '*'
- apiGroups:
  - anisble-operator.lightjack.de
  resources:
  - ansiblehosts/status
  verbs:
  - get
