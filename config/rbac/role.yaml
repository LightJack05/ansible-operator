---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - anisble-operator.lightjack.de
  resources:
  - ansiblehosts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - anisble-operator.lightjack.de
  resources:
  - ansiblehosts/finalizers
  verbs:
  - update
- apiGroups:
  - anisble-operator.lightjack.de
  resources:
  - ansiblehosts/status
  verbs:
  - get
  - patch
  - update
