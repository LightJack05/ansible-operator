# This rule is not used by the project ansible-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ansible-operator.lightjack.de.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ansible-operator
    app.kubernetes.io/managed-by: kustomize
  name: ansibleplaybook-editor-role
rules:
- apiGroups:
  - ansible-operator.lightjack.de
  resources:
  - ansibleplaybooks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ansible-operator.lightjack.de
  resources:
  - ansibleplaybooks/status
  verbs:
  - get
