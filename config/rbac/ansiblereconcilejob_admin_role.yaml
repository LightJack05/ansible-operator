# This rule is not used by the project ansible-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over ansible-operator.lightjack.de.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ansible-operator
    app.kubernetes.io/managed-by: kustomize
  name: ansiblereconcilejob-admin-role
rules:
- apiGroups:
  - ansible-operator.lightjack.de
  resources:
  - ansiblereconcilejobs
  verbs:
  - '*'
- apiGroups:
  - ansible-operator.lightjack.de
  resources:
  - ansiblereconcilejobs/status
  verbs:
  - get
