# This rule is not used by the project ansible-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ansible-operator.lightjack.de resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ansible-operator
    app.kubernetes.io/managed-by: kustomize
  name: ansibleplaybook-viewer-role
rules:
- apiGroups:
  - ansible-operator.lightjack.de
  resources:
  - ansibleplaybooks
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ansible-operator.lightjack.de
  resources:
  - ansibleplaybooks/status
  verbs:
  - get
