server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # cgit ships its static assets (cgit.css, cgit.png, favicon.ico, robots.txt)
    # here; try_files serves them directly before falling through to the CGI.
    root /usr/share/cgit;

    # --- Git smart HTTP: clone / pull / push, protected by basic auth ---
    # e.g.  git clone http://git@HOST/git/myrepo.git
    location ~ ^/git(/.*)$ {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME    /usr/lib/git-core/git-http-backend;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";
        fastcgi_param GIT_PROJECT_ROOT   /srv/git;
        fastcgi_param PATH_INFO          $1;
        fastcgi_param REMOTE_USER        $remote_user;
        fastcgi_pass  unix:/run/fcgiwrap.socket;
    }

    # --- cgit web interface (browsing) ---
    location / {
        try_files $uri @cgit;
    }

    location @cgit {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/lib/cgit/cgit.cgi;
        fastcgi_param PATH_INFO       $uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_pass  unix:/run/fcgiwrap.socket;
    }
}
