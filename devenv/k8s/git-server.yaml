---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: default
  labels:
    app: git-server
spec:
  type: ClusterIP
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: git-server
  namespace: default
  labels:
    app: git-server
subsets:
  - addresses:
      - ip: 172.30.0.10
    ports:
      - name: ssh
        port: 22
        protocol: TCP
      - name: http
        port: 80
        protocol: TCP
