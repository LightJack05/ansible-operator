apiVersion: ansible-operator.lightjack.de/v1alpha1
kind: AnsiblePlaybook
metadata:
  name: inline-playbook
spec:
  inline:
    requirements: |
      collections:
        - name: ansible.posix
      roles:
      - name: ansible_test_role
        src: git+http://git-server.default.svc.cluster.local/git/ansible-test-role.git
        version: main
    playbook: |
      - name: create file with group vars
        hosts: databases
        become: true
      
        roles:
          - role: ansible_test_role
      
      - name: create file with inline vars
        hosts: ssh-node-1
        become: true
        roles:
          - role: ansible_test_role
            vars:
              content: "Hello world!"
              location: /test_file_inline.txt
      
      - name: create file with host vars and inline task
        hosts: ssh-node-2
        become: true
        tasks:
          - name: Create file
            ansible.builtin.copy:
              content: "{{ content }}"
              dest: "{{ location }}"
---
apiVersion: ansible-operator.lightjack.de/v1alpha1
kind: AnsiblePlaybook
metadata:
  name: http-git-playbook
spec:
  git:
    repo:
      url: http://git-server.default.svc.cluster.local/git/playbook-repo.git
    playbookPath: playbook.yml
    requirementsPath: dir/requirements.yml
