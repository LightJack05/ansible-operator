---
apiVersion: ansible-operator.lightjack.de/v1alpha1
kind: AnsibleHost
metadata:
  name: ssh-node-1
  namespace: ansible-operator-system
spec:
  connection:
    host: ssh-node-1.default.svc.cluster.local
    user: ansible
  ssh:
    sshKeySecretRef:
      name: ansible-operator-hosts-private-key
    sshHostKeySecretRef:
      name: ssh-node-1-host-key
    ignoreHostKey: true
  privilege:
    become: true
---
