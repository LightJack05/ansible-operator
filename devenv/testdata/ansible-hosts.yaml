---
apiVersion: ansible-operator.lightjack.de/v1alpha1
kind: AnsibleHost
metadata:
  name: ssh-node-1
spec:
  ansibleName: ssh-node-1
  connection:
    host: ssh-node-1.default.svc.cluster.local
    user: ansible
  ssh:
    sshKeySecretRef:
      name: ansible-operator-hosts-private-key
    sshHostKeySecretRef:
      name: ssh-node-1-host-key
    ignoreHostKey: false
  privilege:
    become: true
---
apiVersion: ansible-operator.lightjack.de/v1alpha1
kind: AnsibleHost
metadata:
  name: ssh-node-2
spec:
  ansibleName: ssh-node-2
  connection:
    host: ssh-node-2.default.svc.cluster.local
    user: ansible
  ssh:
    sshKeySecretRef:
      name: ansible-operator-hosts-private-key
    sshHostKeySecretRef:
      name: ssh-node-2-host-key
    ignoreHostKey: false
  privilege:
    become: true
  hostVars: |
    content: "fun content"
    location: /test-file.txt
---
apiVersion: ansible-operator.lightjack.de/v1alpha1
kind: AnsibleHost
metadata:
  name: ssh-node-3
spec:
  ansibleName: ssh-node-3
  connection:
    host: ssh-node-3.default.svc.cluster.local
    user: ansible
  ssh:
    sshKeySecretRef:
      name: ansible-operator-hosts-private-key
    sshHostKeySecretRef:
      name: ssh-node-3-host-key
    ignoreHostKey: false
  privilege:
    become: true
