apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ansible-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - ansible-operator.lightjack.de
  resources:
  - ansiblegroups
  - ansiblehosts
  - ansibleplaybooks
  - ansiblereconcilejobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ansible-operator.lightjack.de
  resources:
  - ansiblegroups/finalizers
  - ansiblehosts/finalizers
  - ansibleplaybooks/finalizers
  - ansiblereconcilejobs/finalizers
  verbs:
  - update
- apiGroups:
  - ansible-operator.lightjack.de
  resources:
  - ansiblegroups/status
  - ansiblehosts/status
  - ansibleplaybooks/status
  - ansiblereconcilejobs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
